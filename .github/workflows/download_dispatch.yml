name: 'Download Dispatch'

on:
  workflow_dispatch:
    inputs:
      JM_ALBUM_IDS:
        description: '禁漫本子ID，多个id用空格分隔，如: 12345 12346'
        required: true
        default: ''
      PDF_OPTION:
        description: '是否要下载后将图片合并为pdf文件'
        required: false
        type: choice
        options:
          - 否
          - 是 | 本子维度合并pdf
          - 是 | 章节维度合并pdf
      ZIP_NAME:
        type: string
        default: 本子.tar.gz
      UPLOAD_NAME:
        type: string
        default: ''
      IMAGE_SUFFIX:
        type: string
        default: ''
      DIR_RULE:
        type: string
        default: ''

env:
  JM_ALBUM_IDS: ${{ github.event.inputs.JM_ALBUM_IDS }}
  ZIP_NAME: ${{ github.event.inputs.ZIP_NAME }}
  UPLOAD_NAME: ${{ github.event.inputs.UPLOAD_NAME }}
  IMAGE_SUFFIX: ${{ github.event.inputs.IMAGE_SUFFIX }}
  PDF_OPTION: ${{ github.event.inputs.PDF_OPTION }}
  DIR_RULE: ${{ github.event.inputs.DIR_RULE }}

  JM_USERNAME: ${{ secrets.JM_USERNAME }}
  JM_PASSWORD: ${{ secrets.JM_PASSWORD }}

defaults:
  run:
    shell: bash

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装pip依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install img2pdf
        if: inputs.PDF_OPTION != '否'
        run: |
          pip install img2pdf

      - name: 安装jmcomic（pip）
        if: ${{ github.ref != 'refs/heads/dev' }}
        run: |
          pip install jmcomic

      - name: 安装jmcomic（本地）
        if: ${{ github.ref == 'refs/heads/dev' }}
        run: |
          pip install -e .

      - name: 运行下载脚本
        env:
          JM_DOWNLOAD_DIR: /home/runner/work/jmcomic/download/
        run: |
          python usage/workflow_download.py

      - name: 压缩文件
        run: |
          cd /home/runner/work/jmcomic/download/
          tar -zcvf "../$ZIP_NAME" ./
          mv "../$ZIP_NAME" .

      - name: 上传结果
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.UPLOAD_NAME }}
          path: /home/runner/work/jmcomic/download/${{ env.ZIP_NAME }}
          retention-days: 1
